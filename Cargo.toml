[package]
name = "sparkwatch"
version = "0.1.0"
edition = "2024"
description = "Terminal monitor for Apache Spark applications: a Spark UI you can use over SSH"
repository = "https://github.com/VishnuRaman/sparkwatch"
license = "Apache-2.0"
readme = "README.md"
keywords = ["spark", "tui", "monitoring", "kubernetes"]
categories = ["command-line-utilities"]
rust-version = "1.88"

# Small, fast binaries for the release assets; debug builds are unaffected.
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "process", "io-util"] }
