[package]
name = "sparkwatch-streaming-job"
version = "0.1.0"
edition = "2024"
description = "A long-running Structured Streaming workload, driven over Spark Connect, to point sparkwatch at"
publish = false

# Standalone crate: don't get pulled into the sparkwatch package above.
[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
spark-connect-rs = "0.0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
